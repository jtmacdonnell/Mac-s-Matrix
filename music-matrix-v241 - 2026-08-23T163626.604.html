/* ── Mode colours ───────────────────────────────────────────────────────────
   One hue per diatonic family, so a Dorian-type mode is blue in every parent
   scale and the colour reliably answers "what kind of sound is this?".
   "Altered" keeps its own pink — it's the one mode with a unique role.
   Modes whose name maps to no family (pentatonic, bebop, symmetrical) are left
   with whatever colour they were given.                                        */
const MODE_FAMILY_BASE = {
  Ionian:"#4ade80", Dorian:"#60a5fa", Phrygian:"#a78bfa", Lydian:"#fbbf24",
  Mixolydian:"#f97316", Aeolian:"#06b6d4", Locrian:"#f43f5e"
};
const MODE_FAMILY_OF = (name)=>{
  const n = (name||"").toLowerCase();
  if(/^altered/.test(n))                  return null;        // keeps its own colour
  if(/alt\. dim/.test(n))                 return "Locrian";   // ultralocrian
  if(/harm\. major/.test(n))              return "Ionian";
  if(/mel\. minor|harm\. minor/.test(n))  return "Aeolian";
  if(/mixo/.test(n))                      return "Mixolydian"; // before Lydian —
  if(/lydian/.test(n))                    return "Lydian";     // "Mixolydian" contains "lydian"
  if(/phrygian/.test(n))                  return "Phrygian";
  if(/locrian/.test(n))                   return "Locrian";
  if(/dorian/.test(n))                    return "Dorian";
  if(/ionian/.test(n))                    return "Ionian";
  if(/aeolian/.test(n))                   return "Aeolian";
  return null;
};
SCALE_GROUPS.forEach(g=>g.scales.forEach(sc=>(sc.modes||[]).forEach(m=>{
  const fam = MODE_FAMILY_OF(m.name);
  if(fam) m.color = MODE_FAMILY_BASE[fam];
})));

const ALL_SCALES = SCALE_GROUPS.flatMap(g=>g.scales);

                 searched: C Dorian's parent is B♭, not A♯ — and spelling it A♯ makes
                 modeRootName render the mode root as B♯. Pick whichever spelling
                 round-trips; fall back to the flat name, which is the usual one for
                 a parent key. */
              scaleRoot: (()=>{
                const _cands=[FLAT_NAMES[scaleRootIdx], SHARP_NAMES[scaleRootIdx]];
                const _ok=_cands.find(c=>{
                  const _i=scale.intervals.indexOf(((chordRootIdx-scaleRootIdx)%12+12)%12);
                  if(_i<0) return getNames(c)[chordRootIdx]===chordRoot;
                  return spellScale(c, scale.intervals)[_i]===chordRoot;
                });
                return _ok || FLAT_NAMES[scaleRootIdx];
              })(),
              scaleRootIdx,
              modeRootIdx: chordRootIdx,
              modeRoot: chordRoot,
              scaleIntervals: scale.intervals,
              modeDegree: mode.degree,
              scaleIdx,
              groupIdx,
              modeIdx: mi,
              groupName: g.group,
              groupColor: g.color,
              score,
            });
          }
        }
      }
    }
  }

  // Sort by score descending
  results.sort((a,b) => b.score - a.score);
  return results;
}

// ─── ROMAN NUMERAL ANALYSIS ──────────────────────────────
// ─── MODE / SCALE SEARCH ─────────────────────────────────
// ─── JAZZ PROGRESSION ANALYZER ───────────────────────────

const JAZZ_KEY_SCALES = [
  { name:"Major",         abbr:"maj",  intervals:[0,2,4,5,7,9,11],
    modes:["Ionian","Dorian","Phrygian","Lydian","Mixolydian","Aeolian","Locrian"],
    romans:["I","II","III","IV","V","VI","VII"] },
  { name:"Natural Minor", abbr:"Nat. Min", intervals:[0,2,3,5,7,8,10],
    modes:["Aeolian","Locrian","Ionian","Dorian","Phrygian","Lydian","Mixolydian"],
    romans:["i","ii","III","iv","v","VI","VII"] },
  { name:"Melodic Minor", abbr:"Mel. Min", intervals:[0,2,3,5,7,9,11],
    modes:["Mel. Min","Dorian b2","Lydian Aug","Lydian Dom","Mixo b6","Locrian #2","Altered"],
    romans:["I","II","III","IV","V","VI","VII"] },
  { name:"Harmonic Minor",abbr:"Harm. Min", intervals:[0,2,3,5,7,8,11],
    modes:["Harm. Min","Locrian #6","Ionian #5","Dorian #4","Phrygian ♭4","Lydian #2","Alt Dim"],
    romans:["I","II","III","IV","V","VI","VII"] },
];

// Score a single key candidate against a window of chords
function scoreKey(keyRootIdx, ks, chords) {
  const keyNotes = new Set(ks.intervals.map(i => (keyRootIdx + i) % 12));
  // The I chord root and V chord root for this key
  const tonicRoot = keyRootIdx;
  const domRoot = (keyRootIdx + 7) % 12;
  const iiRoot = (keyRootIdx + 2) % 12;
  let score = 0, covered = 0;

  for (let ci = 0; ci < chords.length; ci++) {
    const chord = chords[ci];
    const cRoot = chord.chordRootIdx;
    const cTones = (chord.semitones || []).map(s => (cRoot + s) % 12);
    const hits = cTones.filter(pc => keyNotes.has(pc)).length;
    const total = cTones.length || 1;

    const isDom7  = cTones.includes((cRoot+4)%12) && cTones.includes((cRoot+10)%12);
    const isMin7  = cTones.includes((cRoot+3)%12) && cTones.includes((cRoot+10)%12);
    const isMaj7  = cTones.includes((cRoot+4)%12) && cTones.includes((cRoot+11)%12);
    const isHalfDim = cTones.includes((cRoot+3)%12) && cTones.includes((cRoot+6)%12) && cTones.includes((cRoot+10)%12);

    // Strong bonus: V7 resolving to I (dom7 whose P5 above = tonic)
    const resolveRoot = (cRoot + 5) % 12;
    if (isDom7 && resolveRoot === tonicRoot) score += 4;

    // Strong bonus: ii-V7 pair (min7 up a P4 to dom7)
    if (ci > 0) {
      const prev = chords[ci-1];
      const pr = prev.chordRootIdx;
      const pt = (prev.semitones||[]).map(s=>(pr+s)%12);
      const prevIsMin7 = pt.includes((pr+3)%12) && pt.includes((pr+10)%12);
      const prevIsHalfDim = pt.includes((pr+3)%12) && pt.includes((pr+6)%12) && pt.includes((pr+10)%12);
      const isP4up = (pr+5)%12 === cRoot; // V root is P4 above ii root
      // ii-V7 → I (2-5-1): huge signal
      if (prevIsMin7 && isDom7 && isP4up && cRoot === domRoot) score += 6;
      // ø-V7 (half-dim ii) → typical minor key cadence
      if (prevIsHalfDim && isDom7 && isP4up && cRoot === domRoot) score += 5;
      // V7 → I resolution in next chord
      if (isDom7 && ci < chords.length-1) {
        const next = chords[ci+1];
        const nr = next.chordRootIdx;
        if ((cRoot+5)%12 === nr) score += 3;
      }
    }

    // Bonus: tonic chord (I or i)
    if (cRoot === tonicRoot && (isMaj7 || isMin7)) score += 2;
    // Bonus: ii chord
    if (cRoot === iiRoot && (isMin7 || isHalfDim)) score += 1.5;

    score += (hits / total) * 3;
    if (hits === total) covered++;
  }
  score += covered * 0.5;
  return score;
}

// Find best key for a window of chords
function findBestKey(chords) {
  let bestScore = -1, bestKey = null;
  for (let ri = 0; ri < 12; ri++) {
    for (let si = 0; si < JAZZ_KEY_SCALES.length; si++) {
      const ks = JAZZ_KEY_SCALES[si];
      const sc = scoreKey(ri, ks, chords);
      if (sc > bestScore) { bestScore = sc; bestKey = { rootIdx: ri, ks, score: sc }; }
    }
  }
  return bestKey;
}

// Given a fixed root, pick the scale with best raw common-tone coverage against chords
function commonToneBestScale(rootIdx, chords) {
  // All pitch classes present across the chord sequence
  const allPCs = new Set();
  chords.forEach(c => (c.semitones||[]).forEach(s => allPCs.add(((c.chordRootIdx+s)%12+12)%12)));

  // ── Critical signals relative to the key root ──────────────────────────────
  const maj7PC  = (rootIdx + 11) % 12; // raised 7th — signature of Harm/Mel Minor
  const nat6PC  = (rootIdx + 9)  % 12; // natural 6th — signature of Melodic Minor
  const b6PC    = (rootIdx + 8)  % 12; // flat 6th    — Nat/Harm Minor, not Mel Minor
  const domVroot= (rootIdx + 7)  % 12; // V chord root
  const iirootN = (rootIdx + 2)  % 12; // ii chord root

  const hasRaised7  = allPCs.has(maj7PC);   // raised 7th anywhere → Harm or Mel
  const hasNat6     = allPCs.has(nat6PC);   // natural 6th → Mel Minor
  const hasFlat6    = allPCs.has(b6PC);     // flat 6th → Nat or Harm

  // V7 chord (dom7 on 5th degree) → Harmonic Minor signal (Harm Min has dom V7, Nat Min has min v7)
  const hasV7 = chords.some(c => {
    const t = (c.semitones||[]).map(s=>((c.chordRootIdx+s)%12+12)%12);
    const isDom = t.includes((c.chordRootIdx+4)%12) && t.includes((c.chordRootIdx+10)%12) && !t.includes((c.chordRootIdx+11)%12);
    return isDom && c.chordRootIdx === domVroot;
  });

  // ø ii chord (m7b5 on 2nd degree) → ANY minor works, but strongest with Harm or Mel Minor
  const hasHalfDimII = chords.some(c => {
    const t = (c.semitones||[]).map(s=>((c.chordRootIdx+s)%12+12)%12);
    return c.chordRootIdx === iirootN &&
           t.includes((c.chordRootIdx+3)%12) && t.includes((c.chordRootIdx+6)%12) && t.includes((c.chordRootIdx+10)%12);
  });

  // IV7 (dom7 on 4th degree) — implies Mixolydian flavor from IV root (→ Melodic Minor context)
  const iv7Root = (rootIdx + 5) % 12;
  const hasIV7 = chords.some(c => {
    const t = (c.semitones||[]).map(s=>((c.chordRootIdx+s)%12+12)%12);
    return c.chordRootIdx === iv7Root && t.includes((c.chordRootIdx+4)%12) && t.includes((c.chordRootIdx+10)%12);
  });

  // ── Score each candidate scale ──────────────────────────────────────────────
  let bestScale = JAZZ_KEY_SCALES[0], bestScore = -Infinity;

  for (const ks of JAZZ_KEY_SCALES) {
    const keyNotes = new Set(ks.intervals.map(i => (rootIdx + i) % 12));
    const isNatMin  = ks.name === 'Natural Minor';
    const isHarmMin = ks.name === 'Harmonic Minor';
    const isMelMin  = ks.name === 'Melodic Minor';
    const isMajor   = ks.name === 'Major';

    // ── Hard exclusions ────────────────────────────────────────────────────────
    // Raised 7th present → cannot be Natural Minor (which has flat 7)
    if (isNatMin && hasRaised7) continue;
    // Natural 6th + raised 7th → Melodic Minor (not Harmonic which has flat 6)
    if (isHarmMin && hasNat6 && hasRaised7 && !hasFlat6) continue;
    // Major scale: if minor tonic chord is present, very unlikely
    const hasMinorTonic = chords.some(c => {
      const t = (c.semitones||[]).map(s=>((c.chordRootIdx+s)%12+12)%12);
      return c.chordRootIdx === rootIdx && t.includes((c.chordRootIdx+3)%12) && !t.includes((c.chordRootIdx+4)%12);
    });
    if (isMajor && hasMinorTonic) continue;

    // ── Base coverage score ────────────────────────────────────────────────────
    let totalHits = 0, totalTones = 0;
    for (const chord of chords) {
      const cRoot = chord.chordRootIdx;
      const cTones = (chord.semitones||[]).map(s=>((cRoot+s)%12+12)%12);
      totalHits += cTones.filter(pc => keyNotes.has(pc)).length;
      totalTones += cTones.length || 1;
    }
    // Coverage is the PRIMARY discriminator — scale×100 so bonuses (max ±5) only
    // matter as tiebreakers when two scales have the same or near-same coverage
    const coverage = totalTones > 0 ? totalHits / totalTones : 0;
    let score = coverage * 100;

    // ── Tiebreaker bonuses ─────────────────────────────────────────────────────
    // V7 cadence is the defining feature of Harmonic Minor
    if (isHarmMin && hasV7) score += 3;
    if (isNatMin  && hasV7) score -= 3;   // V7 contradicts Natural Minor
    if (isMelMin  && hasV7) score += 1;

    // Natural 6 (not flat 6) → Melodic Minor more likely than Harmonic
    // Only effective as tiebreaker when coverage is equal
    if (isMelMin  && hasNat6 && !hasFlat6) score += 2;
    if (isHarmMin && hasNat6 && !hasFlat6) score -= 1;

    // Flat 6 → Harmonic or Natural Minor (not Melodic)
    if (isMelMin  && hasFlat6 && !hasNat6) score -= 2;
    if ((isNatMin||isHarmMin) && hasFlat6) score += 1;

    // ø ii: slight preference for Harm/Mel Minor
    if (hasHalfDimII && (isHarmMin||isMelMin)) score += 1;

    // IV7 (Lydian Dom) → slight preference for Melodic Minor
    if (isMelMin && hasIV7) score += 1;

    // Natural Minor preference when no raised 7th and no dom V7
    if (isNatMin && !hasRaised7 && !hasV7) score += 1;

    if (score > bestScore) { bestScore = score; bestScale = ks; }
  }
  return bestScale;
}

// Return roman numeral cased by chord quality: uppercase=major/dom, lowercase=minor/dim
function caseRoman(roman, cTones, cRoot) {
  const hasM3 = cTones.includes((cRoot+4)%12);
  const hasm3 = cTones.includes((cRoot+3)%12);
  const isMinorQuality = !hasM3 && (hasm3 || cTones.length <= 1);
  return isMinorQuality ? roman.toLowerCase() : roman;
}

// Case a roman numeral from a mode's quality string (used everywhere mode.roman appears)
function displayRoman(roman, quality) {
  if (!quality) return roman;
  const q = quality.toLowerCase();
  const isMinor = q.startsWith("min") || q.startsWith("m7") || q.startsWith("mδ") || q === "m7♭5" || q === "ø7";
  const isDim   = q.startsWith("dim") || q === "°7";
  return (isMinor || isDim) ? roman.toLowerCase() : roman;
}

// Label a single chord within a given key context
function labelChord(chord, keyRootIdx, keyScaleDef, nextChord, prevChord) {
  const cRoot = chord.chordRootIdx;
  const cTones = (chord.semitones || []).map(s => (cRoot + s) % 12);
  const keyNotes = new Set(keyScaleDef.intervals.map(i => (keyRootIdx + i) % 12));

  const isDom7  = cTones.includes((cRoot+4)%12) && cTones.includes((cRoot+10)%12);
  const isMin7  = cTones.includes((cRoot+3)%12) && cTones.includes((cRoot+10)%12);
  const isDim7  = cTones.includes((cRoot+3)%12) && cTones.includes((cRoot+6)%12) && cTones.includes((cRoot+9)%12);
  const isHalfDim = cTones.includes((cRoot+3)%12) && cTones.includes((cRoot+6)%12) && cTones.includes((cRoot+10)%12);

  const degreeIdx = keyScaleDef.intervals.findIndex(iv => (keyRootIdx + iv) % 12 === cRoot);
  const allTonesDiatonic = cTones.every(pc => keyNotes.has(pc));

  // ── Diatonic ──────────────────────────────────────────────
  if (degreeIdx >= 0 && allTonesDiatonic) {
    return {
      roman: caseRoman(keyScaleDef.romans[degreeIdx], cTones, cRoot),
      modeName: keyScaleDef.modes[degreeIdx],
      function: "diatonic",
      label: null,
    };
  }

  // ── Tonic chord tolerance: min7 on key root in Harmonic/Melodic Minor context ──
  // C Harmonic Minor's tonic is CmΔ7, but Cm7 is still functionally tonic (i)
  const isTonicMin7 = isMin7 && cRoot === keyRootIdx;
  const isHarmOrMelMinKey = keyScaleDef.abbr === "Harm. Min" || keyScaleDef.abbr === "Mel. Min";
  if (isTonicMin7 && isHarmOrMelMinKey) {
    return {
      roman: "i",
      modeName: keyScaleDef.modes[0], // tonic mode name
      function: "diatonic",
      label: null,
    };
  }

  // ── Functional ii°: half-dim followed by dominant P4 above ──────────────
  // This is always a functional ii° regardless of key context
  if (isHalfDim && nextChord) {
    const _nr = nextChord.chordRootIdx;
    const _nt = (nextChord.semitones||[]).map(s=>(_nr+s)%12);
    const _nextIsDom = _nt.includes((_nr+4)%12) && _nt.includes((_nr+10)%12);
    if (_nextIsDom && _nr === (cRoot+5)%12) {
      // Determine if V resolves to key tonic (ii°-V-i) or somewhere else (ii°/X-V/X)
      const _tonicRoot = (_nr+5)%12;
      const _isTonicCadence = _tonicRoot === keyRootIdx;
      const _degNames = ["I","bII","II","bIII","III","IV","bV","V","bVI","VI","bVII","VII"];
      const _chromDeg = ((cRoot - keyRootIdx + 12) % 12);
      const _targetRoman = _isTonicCadence ? null : toMusical(FLAT_NAMES[_tonicRoot]);
      return {
        roman: "ii°" + (_targetRoman ? "/"+_targetRoman : ""),
        modeName: keyScaleDef.modes[keyScaleDef.intervals.findIndex(iv=>(keyRootIdx+iv)%12===cRoot)] || null,
        function: "diatonic",
        label: null,
      };
    }
  }

  // ── Secondary dominant: V7/X or VII°/X ───────────────────
  const resolveRoot = (cRoot + 5) % 12; // resolve up a 4th
  const resolveDeg = keyScaleDef.intervals.findIndex(iv => (keyRootIdx + iv) % 12 === resolveRoot);
  // Also check if next chord confirms resolution
  const nextRoot = nextChord ? nextChord.chordRootIdx : -1;
  const nextConfirms = nextRoot === resolveRoot;

  if (isDom7 && (resolveDeg >= 0 || nextConfirms)) {
    const targetRoman = resolveDeg >= 0 ? caseRoman(keyScaleDef.romans[resolveDeg], cTones, cRoot)
      : (nextChord ? toMusical(FLAT_NAMES[nextRoot]) : "?");
    // If resolving to tonic (I or i), just call it V7
    const isTonicResolution = resolveRoot === keyRootIdx;
    return {
      roman: isTonicResolution ? "V7" : "V7/" + targetRoman,
      modeName: null,
      function: isTonicResolution ? "diatonic" : "secondary_dom",
      label: isTonicResolution ? null : "2nd Dom",
    };
  }

  // ── Tritone substitution: bII7 of V, or bII7/X ───────────
  const vRoot = (keyRootIdx + 7) % 12;
  const isTritOfV = isDom7 && (cRoot + 6) % 12 === vRoot;
  // Also tritone sub of a secondary dominant
  const tritResolveRoot = (cRoot + 7) % 12; // tritone sub resolves up a semitone (down tritone = up 4th of target)
  const actualResolve = (cRoot + 1) % 12; // bII7 resolves down a semitone
  const tritResolveDeg = keyScaleDef.intervals.findIndex(iv => (keyRootIdx + iv) % 12 === actualResolve);
  const nextIsTritResolve = nextChord && nextChord.chordRootIdx === actualResolve;

  if (isDom7 && (isTritOfV || nextIsTritResolve)) {
    const targetRoman = tritResolveDeg >= 0 ? keyScaleDef.romans[tritResolveDeg]
      : isTritOfV ? "I" : (nextChord ? toMusical(FLAT_NAMES[actualResolve]) : "?");
    return {
      roman: isTritOfV ? "bII7" : ("bII7/" + targetRoman),
      modeName: "Tritone Sub",
      function: "tritone_sub",
      label: null,
    };
  }

  // ── Passing: dim/half-dim outside current key, not a functional ii°-V ──
  if (isDim7 || isHalfDim) {
    const nextRoot = nextChord ? nextChord.chordRootIdx : -1;
    const nextTones = nextChord ? (nextChord.semitones||[]).map(s=>(nextRoot+s)%12) : [];
    const nextIsDom = nextTones.includes((nextRoot+4)%12) && nextTones.includes((nextRoot+10)%12);
    const nextIsV = nextIsDom && nextRoot === (cRoot+5)%12; // ii°-V: next is dom P4 above
    // Not passing if it's a functional ii°-V
    if (!nextIsV) {
      // Passing if chord tones don't all fit the current key
      const notAllDiatonic = !cTones.every(pc => keyNotes.has(pc));
      if (notAllDiatonic) {
        const chromDeg = ((cRoot - keyRootIdx + 12) % 12);
        const degNames = ["I","bII","II","bIII","III","IV","bV","V","bVI","VI","bVII","VII"];
        return {
          roman: caseRoman(degNames[chromDeg], cTones, cRoot) + "\u00b0",
          modeName: isDim7 ? "Passing Dim7" : "Passing °7",
          function: "passing",
          label: "PASSING",
        };
      }
    }
  }

  // ── Chromatic approach: root moves by semitone to/from prev or next chord ──
  const _prevRoot = prevChord ? prevChord.chordRootIdx : -1;
  const _nextRootB = nextChord ? nextChord.chordRootIdx : -1;
  const _isChromApproach = (
    (_prevRoot >= 0 && (Math.abs(cRoot - _prevRoot) === 1 || Math.abs(cRoot - _prevRoot) === 11)) ||
    (_nextRootB >= 0 && (Math.abs(cRoot - _nextRootB) === 1 || Math.abs(cRoot - _nextRootB) === 11))
  );
  if (_isChromApproach) {
    const _degNames = ["I","bII","II","bIII","III","IV","bV","V","bVI","VI","bVII","VII"];
    const _chromDeg = ((cRoot - keyRootIdx + 12) % 12);
    return {
      roman: caseRoman(_degNames[_chromDeg], cTones, cRoot),
      modeName: null,
      function: "chromatic",
      label: "CHROMATIC",
    };
  }

  // ── Borrowed / modal interchange ──────────────────────────
  // Find the most characteristic parent scale rooted on the chord's own root
  // Priority order: most specific/jazz-relevant first
  const parentScales = [
    { intervals:[0,2,3,5,7,9,11], name:"Melodic Minor" },
    { intervals:[0,2,3,5,7,8,11], name:"Harmonic Minor" },
    { intervals:[0,2,4,5,7,9,11], name:"Major" },
    { intervals:[0,2,3,5,7,9,10], name:"Dorian" },
    { intervals:[0,2,3,5,7,8,10], name:"Aeolian" },
    { intervals:[0,2,4,5,7,9,10], name:"Mixolydian" },
    { intervals:[0,2,4,6,7,9,11], name:"Lydian" },
    { intervals:[0,1,3,5,7,8,10], name:"Phrygian" },
    { intervals:[0,2,4,6,7,9,10], name:"Lydian Dom" },
    { intervals:[0,2,3,5,7,8,11], name:"Harmonic Minor" },
  ];
  for (const ps of parentScales) {
    const psNotes = new Set(ps.intervals.map(i => (cRoot + i) % 12));
    if (cTones.every(pc => psNotes.has(pc))) {
      const degNames = ["I","bII","II","bIII","III","IV","bV","V","bVI","VI","bVII","VII"];
      const chromDeg = ((cRoot - keyRootIdx + 12) % 12);
      return {
        roman: caseRoman(degNames[chromDeg], cTones, cRoot),
        modeName: toMusical(FLAT_NAMES[cRoot] + " " + ps.name),
        function: "borrowed",
        label: "BORROWED",
      };
    }
  }

  // ── Chromatic / unexplained ───────────────────────────────
  const degNames = ["I","bII","II","bIII","III","IV","bV","V","bVI","VI","bVII","VII"];
  const chromDeg = ((cRoot - keyRootIdx + 12) % 12);
  return {
    roman: caseRoman(degNames[chromDeg], cTones, cRoot),
    modeName: null, // filled from best parent scale in row builder
    function: "chromatic",
    label: "CHROMATIC",
  };
}


// Expand a song with sections+form into a flat ch string
// sections: { A: "chord string", B: "chord string", ... }
// form: "AABA" etc.
// Expand all songs that have sections defined
const IREAL_SONG_DB=[];   // song database removed — MY SONGS uses the user's own saved progressions

// JAZZ_STANDARDS is now the full iReal Pro database of 1460 songs
// Songs use compact | separator (no spaces) between bars
// ch field: bars joined by | with chords space-separated within each bar
const JAZZ_STANDARDS = IREAL_SONG_DB.map(s => ({
  ...s,
  // Normalize ch: ensure | has spaces around it for parseProgression compatibility
  ch: s.ch.replace(/\|/g, ' | '),
  _bluesGroups: s.r === 'Blues',
}));

function analyzeProgression(chords, keyHintRootIdx) {
  if (!chords.length) return { keyRootName: null, keyScaleDef: null, keyRootIdx: 0, rows: [], sections: [] };

  // ── Jazz-aware key detection (same logic as popup) ────────
  // Pass 1: scan for ii-V7, ø-V7, V7→non-dom cadences
  const keyAt = {};
  for (let ci = 0; ci < chords.length - 1; ci++) {
    const c0 = chords[ci], c1 = chords[ci+1];
    const r0 = c0.chordRootIdx, r1 = c1.chordRootIdx;
    const t0 = (c0.semitones||[]).map(s=>(r0+s)%12);
    const t1 = (c1.semitones||[]).map(s=>(r1+s)%12);
    const hasM3c0    = t0.includes((r0+4)%12);
    const isMin7     = !hasM3c0 && t0.includes((r0+3)%12) && t0.includes((r0+10)%12);
    const isHalfDim  = !hasM3c0 && t0.includes((r0+3)%12) && t0.includes((r0+6)%12);
    const isDom7c1   = t1.includes((r1+4)%12) && t1.includes((r1+10)%12);
    const isDom7c0   = t0.includes((r0+4)%12) && t0.includes((r0+10)%12);
    const targetIsDom7 = isDom7c1;
    const isP4up     = (r0+5)%12 === r1;
    if ((isMin7||isHalfDim) && isDom7c1 && isP4up) keyAt[ci] = (r1+5)%12;
    if (isDom7c0 && !targetIsDom7 && (r0+5)%12 === r1) { if (keyAt[ci]===undefined) keyAt[ci]=r1; }
  }

  // Pass 2: build key segments
  const segments = [];
  let currentRoot = null;
  for (let ci = 0; ci < chords.length; ci++) {

/* Map a chord's semitones onto an authored quality — exact match only.
   A 9 chord is not a 7 chord, so anything outside the tier returns null and
   keeps the generated-voicings popup rather than showing a near-miss shape. */
function authoredQualityKey(semis){
  if(!semis || !semis.length) return null;
  const norm = a => [...new Set(a.map(x=>((x%12)+12)%12))].sort((p,q)=>p-q).join(",");
  const want = norm(semis);
  for(const q of SHAPE_QUALS){ if(norm(SHAPE_QUAL_IV[q]) === want) return q; }
  return null;
}

/* Collapse a mod-12 shape into one concrete, compact grip for a given root.
   Returns frets indexed by si (0 = high e), null where the string is unused. */
function shapeToFrets(arr, pcRoot){
  if(!arr || !arr.length) return null;
  const r = cagedAnchor(pcRoot);
  let best = null;
  for(let L=0; L<12; L++){
    const mapped = arr.map(x=>[x[0], (((x[1]-L)%12)+12)%12 + L, x[2]||0, x[3]||0]);
    const vals = mapped.map(x=>x[1]);
    const span = Math.max.apply(null,vals) - Math.min.apply(null,vals);
    if(!best || span < best.span) best = {span, mapped};
  }
  let frets = [null,null,null,null,null,null];
  let fings = [0,0,0,0,0,0];
  let offs  = [null,null,null,null,null,null];
  let fingsO = [0,0,0,0,0,0];
  best.mapped.forEach((x,i)=>{ const f = r + x[1];
    if(frets[x[0]]==null || f < frets[x[0]]){
      frets[x[0]] = f; fings[x[0]] = x[2]||0; fingsO[x[0]] = x[3]||0; offs[x[0]] = arr[i][1];
    } });
  let vals = frets.filter(f=>f!=null);
  while(vals.length && Math.min.apply(null,vals) >= 12){
    frets = frets.map(f=>f==null?null:f-12); vals = frets.filter(f=>f!=null);
  }
  const open = frets.some(f=>f===0);
  return {frets, fingsFret:fings, fingsOpen:fingsO, offs, open};
}
/* The five CAGED grips in the same [si, off] form, so both systems diagram alike */
const CAGED_QUALS = ["maj","min"];
/* Fingerings for the CAGED grips, per string in si order (0 = high e).
   Each entry is [fretted, open] — the barre form and the open-position form,
   matching how authored shapes store their two layers. 0 = no finger. */
const CAGED_FINGERS = {
  maj: {
    //     e        B        G        D        A        E
    E: [[1,0],  [1,0],  [2,1],  [4,3],  [3,2],  [1,0]],
    D: [[2,2],  [4,3],  [3,1],  [1,0],  null,   null ],
    C: [[1,0],  [2,1],  [1,0],  [3,2],  [4,3],  null ],
    A: [[1,0],  [3,3],  [3,2],  [3,1],  [1,0],  null ],
    G: [[4,3],  [1,0],  [1,0],  [1,0],  [2,1],  [3,2]]
  },
  min: {
    E: [[1,0],  [1,0],  [1,0],  [4,3],  [3,2],  [1,0]],
    D: [[2,1],  [4,3],  [3,2],  [1,0],  null,   null ],
    C: [null,   [2,2],  [1,0],  [3,1],  [4,3],  null ],
    A: [[1,0],  [2,1],  [4,3],  [3,2],  [1,0],  null ],
    G: [[4,4],  null,   [1,0],  [1,0],  [2,1],  [3,3]]
  }
};
function cagedShapeArr(key, qual){
  if(CAGED_QUALS.indexOf(qual)<0) return [];
  const g = (CAGED_GRIPS[qual]||CAGED_GRIPS.maj)[key]; if(!g) return [];
  const f = (CAGED_FINGERS[qual]||CAGED_FINGERS.maj)[key] || [];
  const out=[]; g.forEach((off,si)=>{ if(off!=null){
    const fi = f[si] || [0,0];
    out.push([si, ((off%12)+12)%12, fi[0]||0, fi[1]||0]);
  }});
  return out;
}

/* The shipped shapes were authored against C Ionian, so they seed exactly those
   five contexts. Every other mode starts blank until it is authored. */
const DEFAULT_CTX_SEED = { triad:"maj", "7th":"maj7", "9":"maj9", "11":"maj11", "13":"maj13" };
const cloneDefaultShapes = ()=>{
  const o={};
  Object.keys(DEFAULT_CTX_SEED).forEach(cell=>{
    const q = DEFAULT_CTX_SEED[cell];
    const key = shapeCtxKey("Major","Ionian",cell);
    o[key]={};
    CUSTOM_SLOTS.forEach(k=>o[key][k]=((DEFAULT_CUSTOM_SHAPES[q]||{})[k]||[]).map(x=>[x[0],x[1],x[2]||0,x[3]||0]));
  });
  return o;
};

function sanitizeShapes(j){
  const out = emptyCustomShapes();
  if(!j || typeof j!=="object") return out;
  // Keep every key present, so context keys survive alongside the legacy quality ones.
  Object.keys(j).forEach(q=>{ const src=j[q]; if(!src||typeof src!=="object") return;
    if(!out[q]) out[q]=emptyShapeSet();
    CUSTOM_SLOTS.forEach(k=>{ if(Array.isArray(src[k])) out[q][k]=src[k].filter(x=>Array.isArray(x)&&x.length>=2).map(x=>[x[0],x[1],x[2]||0,x[3]||0]); }); });
  return out;
}
/* Anything saved before shapes went per-context lives under quality keys (maj,
   maj7 …). Those were authored against Ionian, so lift them into the matching
   Ionian contexts rather than losing them. The legacy keys are left untouched. */
function migrateLegacyShapes(store){
  Object.keys(DEFAULT_CTX_SEED).forEach(cell=>{
    const q   = DEFAULT_CTX_SEED[cell];
    const key = shapeCtxKey("Major","Ionian",cell);
    const legacy = store[q];
    if(!legacy) return;
    const legacyHas = CUSTOM_SLOTS.some(k=>(legacy[k]||[]).length);
    const ctxHas    = store[key] && CUSTOM_SLOTS.some(k=>(store[key][k]||[]).length);
    if(legacyHas && !ctxHas){
      store[key] = store[key] || emptyShapeSet();
      CUSTOM_SLOTS.forEach(k=>{ store[key][k] = (legacy[k]||[]).map(x=>[x[0],x[1],x[2]||0,x[3]||0]); });
    }
  });
  return store;
}

function loadCustomShapes(){
  try{
    const raw = localStorage.getItem(MMX_SHAPE_LS_KEY);
    if(!raw) return cloneDefaultShapes();
    const out = migrateLegacyShapes(sanitizeShapes(JSON.parse(raw)));
    const anySaved = Object.keys(out).some(q=>CUSTOM_SLOTS.some(k=>(out[q][k]||[]).length));
    return anySaved ? out : cloneDefaultShapes();
  }catch(e){ return cloneDefaultShapes(); }
}
function loadCustomPositions(){
  try{
    const raw = localStorage.getItem(MMX_POS_LS_KEY);
    if(!raw) return cloneDefaultPositions();
    const j = JSON.parse(raw), out = emptyCustomPositions();
    CUSTOM_SLOTS.forEach(k=>{ if(Array.isArray(j[k])) out[k]=j[k].filter(x=>Array.isArray(x)&&x.length===2); });
    return CUSTOM_SLOTS.every(k=>!out[k].length) ? cloneDefaultPositions() : out;
  }catch(e){ return cloneDefaultPositions(); }
}
// Fret of the root on the low-E string for a given pitch class
const cagedAnchor = (pcRoot)=>((pcRoot-4)%12+12)%12;
// Is (si,fret) inside the selected scale position? (checks every octave copy on the neck)
function cagedInPosition(key, pcRoot, fret){
  const w = CAGED_POS_WINDOW[key]; if(!w) return false;
  const r = cagedAnchor(pcRoot);
  const width = w[1]-w[0];                       // boxes are 4-5 frets, always < 12
  // Match mod 12 so the box repeats up and down the whole neck with no gap at
  // either end — the octave copy below the nut still contributes its top frets.
  return ((((fret - r - w[0]) % 12) + 12) % 12) <= width;
}
// Is (si,fret) a note of the selected chord grip? (checks every octave copy)
function cagedInGrip(key, qual, pcRoot, si, fret){
  const g = (CAGED_GRIPS[qual]||CAGED_GRIPS.maj)[key]; if(!g) return false;
  const off = g[si]; if(off==null) return false;
  const r = cagedAnchor(pcRoot);
  const minOff = Math.min(...g.filter(v=>v!=null));
  for(let oct=-12; oct<=24; oct+=12){
    if(r+oct+minOff < 0) continue;    // whole grip must fit on the neck, no partial shapes
    if(fret === r+oct+off) return true;
  }
  return false;
}
